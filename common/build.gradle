plugins {
    id "multiloader-common"
    id "net.neoforged.moddev"
}

neoForge {
    neoFormVersion = neo_form_version
    def at = file("src/main/resources/META-INF/accesstransformer.cfg")
    if (at.exists()) {
        accessTransformers.from(at.absolutePath)
    }
    parchment {
        minecraftVersion = parchment_minecraft
        mappingsVersion = parchment_version
    }
}

repositories {
    maven {
        name = "RyanHCode Maven"
        url = uri("https://maven.ryanhcode.dev/releases")
    }
}

dependencies {
    compileOnly group: "org.spongepowered", name: "mixin", version: "0.8.5"
    implementation group: "com.google.code.findbugs", name: "jsr305", version: "3.0.2"
    compileOnly "dev.ryanhcode.sable-companion:sable-companion-common-${minecraft_version}:${sable_version}"
}

configurations.testCompileClasspath.extendsFrom(configurations.compileClasspath)
configurations.testRuntimeClasspath.extendsFrom(configurations.runtimeClasspath)

configurations {
    commonJava {
        canBeResolved = false
        canBeConsumed = true
    }
    commonResources {
        canBeResolved = false
        canBeConsumed = true
    }
}

artifacts {
    commonJava sourceSets.main.java.sourceDirectories.singleFile
    commonResources sourceSets.main.resources.sourceDirectories.singleFile
}
