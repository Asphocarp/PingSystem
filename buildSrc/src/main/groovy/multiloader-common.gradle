plugins {
    id "java-library"
    id "maven-publish"
}

base {
    archivesName = archive_name
    version = mod_version
}

group = maven_group
version = mod_version

java {
    toolchain.languageVersion = JavaLanguageVersion.of(java_version)
    withSourcesJar()
}

repositories {
    mavenCentral()
    exclusiveContent {
        forRepository {
            maven {
                name = "Sponge"
                url = "https://repo.spongepowered.org/repository/maven-public"
            }
        }
        filter { includeGroupAndSubgroups("org.spongepowered") }
    }
    maven {
        name = "Shedaniel"
        url = "https://maven.shedaniel.me/"
    }
    maven {
        name = "TerraformersMC"
        url = "https://maven.terraformersmc.com/releases"
    }
}

dependencies {
    implementation "org.jetbrains:annotations:24.1.0"
    testImplementation "org.junit.jupiter:junit-jupiter:5.10.2"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

tasks.named("test", Test) {
    useJUnitPlatform()
}

["apiElements", "runtimeElements", "sourcesElements"].each { variant ->
    configurations."$variant".outgoing {
        capability("$group:$mod_id-${project.name}-${minecraft_version}:$version")
        capability("$group:$mod_id:$version")
    }
    publishing.publications.configureEach {
        suppressPomMetadataWarningsFor(variant)
    }
}

jar {
    manifest {
        attributes([
                "Specification-Title"   : mod_name,
                "Specification-Vendor"  : mod_author,
                "Specification-Version" : project.jar.archiveVersion,
                "Implementation-Title"  : project.name,
                "Implementation-Version": project.jar.archiveVersion,
                "Implementation-Vendor" : mod_author,
                "Built-On-Minecraft"    : minecraft_version,
        ])
    }
}

def expandProps = [
        "mod_author"             : mod_author,
        "mod_name"               : mod_name,
        "mod_id"                 : mod_id,
        "forge_mod_id"           : project.findProperty("forge_mod_id") ?: mod_id,
        "archive_name"           : archive_name,
        "contributors"           : contributors,
        "license"                : license,
        "description"            : description,
        "link_home"              : link_home,
        "link_src"               : link_src,
        "link_issues"            : link_issues,
        "version"                : version,
        "java_version"           : java_version,
        "minecraft_version"      : minecraft_version,
        "fabric_version"         : fabric_version,
        "fabric_loader_version"  : fabric_loader_version,
        "fabric_compatible_range": fabric_compatible_range,
        "forge_version"          : forge_version,
        "forge_loader_version"   : forge_loader_version,
        "forge_compatible_range" : forge_compatible_range,
        "neoforge_version"          : project.findProperty("neoforge_version") ?: "",
        "neoforge_loader_version"   : project.findProperty("neoforge_loader_version") ?: "",
        "neoforge_compatible_range" : project.findProperty("neoforge_compatible_range") ?: "",
]

processResources {
    filesMatching(["pack.mcmeta", "fabric.mod.json", "META-INF/mods.toml", "META-INF/neoforge.mods.toml", "*.mixins.json"]) {
        expand expandProps
    }
    inputs.properties(expandProps)
}

publishing {
    publications {
        register("mavenJava", MavenPublication) {
            artifactId base.archivesName.get()
            from components.java
        }
    }
}
