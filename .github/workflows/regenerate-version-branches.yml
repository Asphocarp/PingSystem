name: Regenerate Version Branches

on:
  workflow_dispatch:
    inputs:
      start_after:
        description: "Skip generated versions until after this Minecraft version"
        required: false
        type: string
        default: ""

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-22.04
    steps:
      - name: Check out baseline
        uses: actions/checkout@v4
        with:
          ref: 1.19.2
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Set up JDKs
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            17
            21
            25

      - name: Validate Gradle wrapper
        uses: gradle/wrapper-validation-action@v2

      - name: Regenerate branches
        run: |
          set -euo pipefail

          chmod +x ./gradlew ./scripts/migrate-version.sh

          BASELINE="$(./scripts/migrate-version.sh --baseline)"
          PREVIOUS_BRANCH="${BASELINE}"
          START_AFTER="${{ inputs.start_after }}"
          SHOULD_RUN="true"

          git fetch origin "+refs/heads/*:refs/remotes/origin/*"

          if [ -n "${START_AFTER}" ]; then
            SHOULD_RUN="false"
          fi

          ARTIFACTS_DIR="${RUNNER_TEMP}/branch-artifacts"
          rm -rf "${ARTIFACTS_DIR}"
          mkdir -p "${ARTIFACTS_DIR}"

          for VERSION in $(./scripts/migrate-version.sh --versions); do
            if [ "${VERSION}" = "${BASELINE}" ]; then
              continue
            fi

            if [ "${SHOULD_RUN}" = "false" ]; then
              if [ "${VERSION}" = "${START_AFTER}" ]; then
                SHOULD_RUN="true"
              fi
              PREVIOUS_BRANCH="origin/${VERSION}"
              continue
            fi

            git checkout -B "${VERSION}" "${PREVIOUS_BRANCH}"
            if [ -n "${START_AFTER}" ]; then
              git checkout "origin/${BASELINE}" -- .github ci scripts
            fi
            rm -rf branch-artifacts
            ./scripts/migrate-version.sh "${VERSION}"

            MOD_VERSION="$(grep '^mod_version=' gradle.properties | cut -d'=' -f2- | xargs)"
            git add -A
            git commit -m ":alien: migrate v${MOD_VERSION} to ${VERSION}"

            JAVA_VERSION="$(grep '^java_version=' gradle.properties | cut -d'=' -f2- | xargs)"
            JAVA_HOME_VAR="JAVA_HOME_${JAVA_VERSION}_X64"
            export JAVA_HOME="${!JAVA_HOME_VAR}"
            export PATH="${JAVA_HOME}/bin:${PATH}"

            for LOADER in $(./scripts/migrate-version.sh --loaders "${VERSION}"); do
              for attempt in 1 2 3; do
                if ./gradlew -Dnet.minecraftforge.gradle.check.certs=false ":${LOADER}:build"; then
                  break
                fi
                if [ "$attempt" = "3" ]; then
                  exit 1
                fi
                sleep $((attempt * 20))
              done
              mkdir -p "${ARTIFACTS_DIR}/${VERSION}/${LOADER}"
              cp "${LOADER}/build/libs/"*.jar "${ARTIFACTS_DIR}/${VERSION}/${LOADER}/"
            done

            git push --force-with-lease origin "${VERSION}"
            PREVIOUS_BRANCH="${VERSION}"
          done

      - name: Upload generated artifacts
        uses: actions/upload-artifact@v4
        with:
          name: generated-version-branches
          path: ${{ runner.temp }}/branch-artifacts
