name: CI

on:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Extract Java version
        run: echo "JAVA_VERSION=$(grep '^java_version=' gradle.properties | cut -d'=' -f2- | xargs)" >> "$GITHUB_ENV"

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Validate Gradle wrapper
        uses: gradle/wrapper-validation-action@v2

      - name: Build declared loaders
        run: |
          set -euo pipefail
          chmod +x ./gradlew ./scripts/migrate-version.sh
          MC_VERSION="$(grep '^minecraft_version=' gradle.properties | cut -d'=' -f2- | xargs)"
          for LOADER in $(./scripts/migrate-version.sh --loaders "${MC_VERSION}"); do
            for attempt in 1 2 3; do
              if ./gradlew -Dnet.minecraftforge.gradle.check.certs=false ":${LOADER}:build"; then
                break
              fi
              if [ "$attempt" = "3" ]; then
                exit 1
              fi
              sleep $((attempt * 20))
            done
          done

  branch-freshness:
    runs-on: ubuntu-22.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check configured branches contain base marker
        run: |
          set -euo pipefail
          BASE_BRANCH="$(./scripts/migrate-version.sh --baseline)"
          BRANCHES="$(./scripts/migrate-version.sh --versions | xargs)"
          if ! git rev-parse --verify "origin/${BASE_BRANCH}" >/dev/null 2>&1; then
            echo "Base branch ${BASE_BRANCH} is not available yet; skipping freshness check."
            exit 0
          fi
          MARKER="$(git rev-parse "origin/${BASE_BRANCH}")"
          for branch in $BRANCHES; do
            if ! git rev-parse --verify "origin/${branch}" >/dev/null 2>&1; then
              echo "Branch ${branch} is not available yet; skipping."
              continue
            fi
            if ! git merge-base --is-ancestor "$MARKER" "origin/${branch}"; then
              echo "::warning::${branch} does not contain base marker ${MARKER}."
            fi
          done
