name: Deploy to Platforms

on:
  workflow_dispatch:
    inputs:
      loaders:
        description: "Loaders"
        required: true
        type: string
        default: "forge, neoforge, fabric"
      versions:
        description: "Versions"
        required: true
        type: string
        default: "1.19.2, 1.19.3, 1.19.4, 1.20.1, 1.20.2, 1.20.4, 1.20.6, 1.21.1, 1.21.3, 1.21.4, 1.21.5, 1.21.8, 1.21.10, 1.21.11, 26.1.2"
      publish_curseforge:
        description: "Publish to CurseForge"
        required: true
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: platform-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare Matrix
    runs-on: ubuntu-22.04
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Check out baseline
        uses: actions/checkout@v4
        with:
          ref: 1.19.2

      - name: Set matrix
        id: set-matrix
        run: |
          set -euo pipefail
          VERSIONS="${{ github.event.inputs.versions }}"
          LOADERS="${{ github.event.inputs.loaders }}"
          MATRIX_JSON='{"include":['
          for VERSION in $(echo "$VERSIONS" | sed "s/,/ /g"); do
            DECLARED_LOADERS="$(./scripts/migrate-version.sh --loaders "$VERSION")"
            for LOADER in $(echo "$LOADERS" | sed "s/,/ /g"); do
              if ! echo " $DECLARED_LOADERS " | grep -q " $LOADER "; then
                continue
              fi
              MATRIX_JSON+="{\"version\":\"$VERSION\",\"loader\":\"$LOADER\"},"
            done
          done
          MATRIX_JSON="${MATRIX_JSON%,}]}"
          echo "matrix=$MATRIX_JSON" >> "$GITHUB_OUTPUT"

      - name: Validate CurseForge publishing token
        if: ${{ inputs.publish_curseforge }}
        env:
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
          CURSEFORGE_PROJECT: ${{ vars.CURSEFORGE_PROJECT || secrets.CURSEFORGE_PROJECT }}
        run: |
          set -euo pipefail

          if [ -z "${CURSEFORGE_TOKEN}" ]; then
            echo "::error::CURSEFORGE_TOKEN is required when publish_curseforge is true."
            exit 1
          fi

          if [ -z "${CURSEFORGE_PROJECT}" ]; then
            echo "::error::CURSEFORGE_PROJECT is required when publish_curseforge is true. Create the CurseForge project manually, then save its numeric project ID as CURSEFORGE_PROJECT."
            exit 1
          fi

          http_status="$(curl --silent --show-error --output /tmp/curseforge-version-types.json --write-out '%{http_code}' --header "X-Api-Token: ${CURSEFORGE_TOKEN}" https://minecraft.curseforge.com/api/game/version-types || true)"
          if [ "${http_status}" != "200" ]; then
            echo "::error::CURSEFORGE_TOKEN was rejected by the legacy CurseForge Upload API (HTTP ${http_status}). Use an API token from legacy.curseforge.com account settings / Authors API Tokens. The bcrypt-like Personal API Key and cfc_pat Studio/Core API token are rejected by this upload API."
            exit 1
          fi

  build:
    name: Build
    needs: prepare
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ matrix.version }}

      - name: Extract Java version
        run: echo "JAVA_VERSION=$(grep '^java_version=' gradle.properties | cut -d'=' -f2- | xargs)" >> "$GITHUB_ENV"

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Build loader
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          for attempt in 1 2 3; do
            if timeout 15m ./gradlew -Dnet.minecraftforge.gradle.check.certs=false ":${{ matrix.loader }}:build"; then
              exit 0
            fi
            if [ "$attempt" = "3" ]; then
              exit 1
            fi
            sleep $((attempt * 20))
          done

      - name: Archive build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.loader }}-${{ matrix.version }}
          path: |
            ./${{ matrix.loader }}/build/libs
            CHANGELOG.md
            gradle.properties
          retention-days: 7

  publish:
    name: Publish
    needs:
      - prepare
      - build
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            publish.gradle
          sparse-checkout-cone-mode: false
          ref: ${{ matrix.version }}

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10"

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: build-${{ matrix.loader }}-${{ matrix.version }}

      - name: Prepare publish environment
        run: |
          set -euo pipefail

          get_prop() {
            grep "^$1=" gradle.properties | cut -d'=' -f2- | xargs
          }

          ARCHIVE_NAME=$(get_prop "archive_name")
          MOD_VERSION=$(get_prop "mod_version")
          MC_VERSION=$(get_prop "minecraft_version")
          LOADER="${{ matrix.loader }}"
          LOADER_UPPER=$(echo "$LOADER" | tr '[:lower:]' '[:upper:]')
          case "$LOADER" in
            fabric) LOADER_GRADLE="Fabric" ;;
            forge) LOADER_GRADLE="Forge" ;;
            neoforge) LOADER_GRADLE="NeoForge" ;;
            *)
              echo "::error::Unsupported loader: $LOADER"
              exit 1
              ;;
          esac
          VERSION_RANGE=$(get_prop "${LOADER}_compatible_range")
          VERSION_START=$(echo "$VERSION_RANGE" | grep -oE '[0-9]+\.[0-9]+(\.[0-9]+)?' | sed -n '1p')
          JAR_NAME="${ARCHIVE_NAME}-${MOD_VERSION}-${LOADER}-${MC_VERSION}"
          JAR_PATH="./build/libs/${JAR_NAME}.jar"

          mkdir -p ./build/libs
          test -f "./${LOADER}/build/libs/${JAR_NAME}.jar"
          mv "./${LOADER}/build/libs/${JAR_NAME}.jar" "$JAR_PATH"

          {
            echo "ARCHIVE_NAME=$ARCHIVE_NAME"
            echo "MOD_VERSION=$MOD_VERSION"
            echo "MC_VERSION=$MC_VERSION"
            echo "${LOADER_UPPER}_VERSION_START=$VERSION_START"
            echo "${LOADER_UPPER}_JAR_PATH=$JAR_PATH"
            echo "LOADER_GRADLE=$LOADER_GRADLE"
            echo "RELEASE_TAG=v${MOD_VERSION}-${LOADER}-${MC_VERSION}"
            echo "REF_NAME=${{ matrix.version }}"
          } >> "$GITHUB_ENV"

      - name: Remove existing GitHub release for reruns
        run: gh release delete "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to platforms
        run: |
          set -euo pipefail
          if [ "${PUBLISH_CURSEFORGE}" = "true" ]; then
            if [ -z "${CURSEFORGE_TOKEN}" ]; then
              echo "::error::CURSEFORGE_TOKEN is required when publish_curseforge is true."
              exit 1
            fi
            if [ -z "${CURSEFORGE_PROJECT}" ]; then
              echo "::error::CURSEFORGE_PROJECT is required when publish_curseforge is true. Create the CurseForge project manually, then save its numeric project ID as a repository variable or secret named CURSEFORGE_PROJECT."
              exit 1
            fi
          else
            export CURSEFORGE_TOKEN=""
            export CURSEFORGE_PROJECT=""
          fi
          echo "rootProject.buildFileName = 'publish.gradle'" > settings.gradle
          if [ "${PUBLISH_CURSEFORGE}" = "true" ]; then
            gradle "publish${LOADER_GRADLE}-CF"
          fi
          gradle "publish${LOADER_GRADLE}-MR" "publish${LOADER_GRADLE}-GH"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          MODRINTH_PROJECT: RECCOz9u
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
          CURSEFORGE_PROJECT: ${{ vars.CURSEFORGE_PROJECT || secrets.CURSEFORGE_PROJECT }}
          PUBLISH_CURSEFORGE: ${{ inputs.publish_curseforge }}
